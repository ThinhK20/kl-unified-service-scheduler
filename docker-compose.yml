# Unified Service Scheduler - full local stack: SQL Server + API + web UI.
#
#   1. Copy .env.example to .env and set MSSQL_SA_PASSWORD (the only secret; .env is git-ignored).
#   2. docker compose up -d --build
#   3. Web UI: http://localhost:3000   API + Swagger: http://localhost:5080/swagger   SQL Server: localhost,1433
#
# The API applies the EF migrations (tables + seed data) on startup. `docker compose down -v` also deletes the data.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scheduler-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - scheduler-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: src/Scheduler.Api/Dockerfile
      # Behind a TLS-inspecting proxy only: add a build secret `extra_ca` in a local override file
      # (see the Dockerfile). Not needed on a normal machine.
    container_name: scheduler-api
    environment:
      ConnectionStrings__Scheduler: "Server=db,1433;Database=Scheduler;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl or wget, but it has bash: send a plain HTTP request over /dev/tcp
      # and check for "200" in the status line. /health/ready also checks the database.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle; the browser calls the API on the host port.
        VITE_API_BASE_URL: http://localhost:5080
    container_name: scheduler-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  scheduler-sqldata:
